# Compila la versione web dell'app su GitHub (gratis per i repository pubblici).
# Ogni push su "main" produce un file "bacheca-web" scaricabile dalla scheda Actions:
# il suo contenuto va copiato nella cartella web/ del server.
name: Build web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: bacheca-web
          path: build/web
